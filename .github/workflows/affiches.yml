name: Affiches du carrousel

# Dès qu'une image est ajoutée ou retirée dans img/affiches/,
# data/posters.json est mis à jour automatiquement.
on:
  push:
    branches: [main]
    paths:
      - "img/affiches/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mettre à jour posters.json
        run: python .github/scripts/sync_posters.py
      - name: Enregistrer le changement
        run: |
          if git diff --quiet data/posters.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posters.json
          git commit -m "Affiches : posters.json mis à jour automatiquement"
          git push
